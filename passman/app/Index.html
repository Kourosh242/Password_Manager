      function renderRestoreComponent() {
        const fileInput = h('input', {
          type: 'file',
          class: 'input',
          accept: '.json,application/json',
          'aria-label': 'فایل پشتیبان'
        });

        const passwordInput = h('input', {
          type: 'password',
          class: 'input',
          dir: 'ltr',
          'aria-label': 'رمز فایل پشتیبان'
        });

        const message = h('p', { class: 'form-error', role: 'status', text: '' });

        const restoreButton = h('button', {
          class: 'btn primary',
          type: 'button',
          onClick: async () => {
            message.textContent = '';

            if (!fileInput.files?.[0]) {
              message.textContent = 'ابتدا فایل پشتیبان را انتخاب کنید.';
              return;
            }

            if (!passwordInput.value) {
              message.textContent = 'رمز فایل پشتیبان را وارد کنید.';
              return;
            }

            restoreButton.disabled = true;

            try {
              message.textContent = 'در حال بررسی ساختار فایل پشتیبان...';
              const backup = await BackupManager.parseBackupFile(fileInput.files[0]);

              const ok = await Dialog.confirm(
                'بازیابی این پشتیبان، گاوصندوق فعلی را جایگزین می‌کند. ادامه می‌دهید؟',
                { force: true, danger: true, confirmText: 'بازیابی' }
              );

              if (!ok) {
                message.textContent = 'بازیابی لغو شد.';
                return;
              }

              message.textContent = 'در حال بازیابی...';
              await BackupManager.applyBackup(backup, passwordInput.value);
              toast('بازیابی با موفقیت انجام شد.', 'success');
              navigateToStartup();
            } catch (error) {
              const errorMessage = error?.message;

              if (errorMessage === 'AUTH_FAILED') {
                message.textContent = 'رمز فایل پشتیبان نادرست است یا فایل خراب است.';
              } else if (errorMessage === 'UNSUPPORTED_BACKUP') {
                message.textContent = 'نسخهٔ این فایل پشتیبان پشتیبانی نمی‌شود.';
              } else {
                message.textContent = 'فایل پشتیبان معتبر نیست یا بازیابی ناموفق بود.';
              }

              toast(message.textContent, 'error');
            } finally {
              restoreButton.disabled = false;
            }
          }
        }, ['بازیابی']);

        return h('div', { class: 'card form' }, [
          h('p', {
            class: 'muted small',
            text: 'فایل پشتیبان فقط به‌صورت رمزنگاری‌شده است و برای بازیابی به رمز پشتیبان نیاز دارد.'
          }),
          h('div', { class: 'field' }, [h('label', { text: 'فایل پشتیبان' }), fileInput]),
          h('div', { class: 'field' }, [
            h('label', { text: 'رمز پشتیبان' }),
            h('div', { class: 'input-button' }, [passwordInput, createPasswordToggle(passwordInput)])
          ]),
          message,
          restoreButton
        ]);
      }

      function renderBackupPage() {
        const backupPassword = h('input', {
          type: 'password',
          class: 'input',
          dir: 'ltr',
          'aria-label': 'رمز پشتیبان'
        });

        const backupConfirm = h('input', {
          type: 'password',
          class: 'input',
          dir: 'ltr',
          'aria-label': 'تکرار رمز پشتیبان'
        });

        const filenameInput = h('input', {
          class: 'input',
          value: SettingsManager.getPath('backupFilename'),
          maxlength: 100,
          'aria-label': 'نام فایل پشتیبان'
        });

        const status = h('p', { class: 'muted', role: 'status', text: '' });

        const backupButton = h('button', {
          class: 'btn primary',
          type: 'button',
          onClick: async () => {
            status.textContent = '';

            if (backupPassword.value !== backupConfirm.value) {
              status.textContent = 'رمز پشتیبان و تکرار آن یکسان نیست.';
              return;
            }

            const validationError = validateMasterPassword(backupPassword.value);
            if (validationError) {
              status.textContent = validationError;
              return;
            }

            backupButton.disabled = true;
            status.textContent = 'در حال ساخت پشتیبان رمزنگاری‌شده...';

            try {
              const filename = await BackupManager.createBackup(backupPassword.value, filenameInput.value);
              status.textContent = `فایل پشتیبان با نام ${filename} ذخیره شد.`;
              toast('پشتیبان رمزنگاری‌شده ایجاد شد.', 'success');
              backupPassword.value = '';
              backupConfirm.value = '';
            } catch (error) {
              status.textContent = userErrorMessage(error);
              toast(userErrorMessage(error), 'error');
            } finally {
              backupButton.disabled = false;
            }
          }
        }, ['ساخت پشتیبان رمزنگاری‌شده']);

        const backupCard = h('div', { class: 'card form' }, [
          h('p', {
            class: 'muted small',
            text: 'خروجی پشتیبان حاوی دادهٔ رمزنگاری‌شده است و بدون رمز پشتیبان قابل استفاده نیست.'

          h('div', { class: 'field' }, [
            h('label', { text: 'رمز پشتیبان' }),
            h('div', { class: 'input-button' }, [backupPassword, createPasswordToggle(backupPassword)])
          ]),
          h('div', { class: 'field' }, [
            h('label', { text: 'تکرار رمز پشتیبان' }),
            h('div', { class: 'input-button' }, [backupConfirm, createPasswordToggle(backupConfirm)])
          ]),
          h('div', { class: 'field' }, [
            h('label', { text: 'نام فایل پشتیبان' }),
            filenameInput
          ]),
          status,
          backupButton
        ]);

        return h('div', {}, [
          h('h2', { text: 'پشتیبان‌گیری و بازیابی' }),
          backupCard,
          h('h3', { class: 'section-title', text: 'بازیابی' }),
          renderRestoreComponent()
        ]);
      }

      function renderAppShell(route) {
        const navItems = [
          { path: '/dashboard', label: 'داشبورد', icon: '🏠' },
          { path: '/passwords', label: 'رمزها', icon: '🔑' },
          { path: '/favorites', label: 'علاقه‌مندی‌ها', icon: '⭐' },
          { path: '/search', label: 'جستجو', icon: '🔍' },
          { path: '/generator', label: 'تولید رمز', short: 'رمزساز', icon: '🎲' },
          { path: '/categories', label: 'دسته‌ها', icon: '🗂️' },
          { path: '/settings', label: 'تنظیمات', icon: '⚙️' },
          { path: '/backup', label: 'پشتیبان', icon: '💾' },
          { path: '/about', label: 'درباره', icon: 'ℹ️' }
        ].filter(item => !(item.path === '/passwords' || item.path === '/favorites'));

        const nav = h('nav', { class: 'nav', 'aria-label': 'ناوبری اصلی' }, navItems.map(item => {
          const active = route.path === item.path ||
            (item.path === '/passwords' && route.path.startsWith('/passwords') && !['/favorites', '/search'].includes(route.path)) ||
            (item.path === '/search' && (route.path === '/passwords' || route.path === '/favorites'));

          return h('a', {
            href: `#${item.path}`,
            class: `nav-link ${active ? 'active' : ''}`,
            'aria-current': active ? 'page' : null
          }, [
            h('span', { class: 'nav-icon', 'aria-hidden': 'true', text: item.icon }),
            h('span', { text: IS_ANDROID && item.short ? item.short : item.label })
          ]);
        }));

        const header = h('header', { class: 'appbar' }, [
          h('button', {
            class: 'icon-btn',
            type: 'button',
            'aria-label': 'قفل کردن گاوصندوق',
            onClick: () => lockNow(false)
          }, ['🔒']),
          h('img', { class: 'appbar-logo', src: LOGO_DATA_URI, alt: '', width: 30, height: 30 }),
          h('h1', { text: CONSTANTS.APP_NAME }),
          h('a', { class: 'btn primary', href: '#/passwords/new' }, ['+ افزودن رمز'])
        ]);

        const main = renderRoute(route);

        return h('div', { class: 'app-shell' }, [
          header,
          nav,
          h('main', { id: 'main', class: 'main', tabindex: '-1' }, [main])
        ]);
      }

      function renderRoute(route) {
        const path = route.path;

        if (path === '/' || path === '/dashboard') return renderDashboard();

        if (path === '/passwords') {
          App.state.ui.onlyFavorites = false;
          return renderPasswordsList(true);
        }

        if (path === '/favorites') {
          App.state.ui.onlyFavorites = true;
          return renderPasswordsList(false);
        }

        if (path === '/search') {
          App.state.ui.onlyFavorites = false;
          return renderPasswordsList(true);
        }

        if (path === '/passwords/new') return renderEntryForm(null);
        if (path === '/generator') return renderGenerator();
        if (path === '/categories') return renderCategories();
        if (path === '/settings') return renderSettings();
        if (path === '/backup') return renderBackupPage();
        if (path === '/restore') return renderRestorePage(false);
        if (path === '/about') return renderAbout();

        const detailsMatch = path.match(/^\/passwords\/([^/]+)$/);
        if (detailsMatch) return renderEntryDetails(detailsMatch[1]);

        const editMatch = path.match(/^\/passwords\/([^/]+)\/edit$/);
        if (editMatch) return renderEntryForm(editMatch[1]);

        return renderNotFound();
      }

      function renderCurrent() {
        const root = document.getElementById('app-root');
        if (!root || !App.state.initialized) return;

        const route = parseHash();

        if (App.state.corrupted) {
          if (route.path === '/restore') {
            root.replaceChildren(renderRestorePage(true));
          } else {
            root.replaceChildren(renderCorruptedPage());
          }
          return;
        }

        if (!App.state.hasVault || App.state.locked) {
          if (route.path === '/restore') {
            root.replaceChildren(renderRestorePage(true));
            return;
          }

          if (route.path !== '/lock') {
            location.hash = '#/lock';
            return;
          }

          root.replaceChildren(renderLockPage());
          return;
        }

        if (route.path === '/lock') {
          navigateToStartup();
          return;
        }

        root.replaceChildren(renderAppShell(route));
      }

      async function refreshVaultExistence() {
        const record = await DB.getItem('vault');

        if (!record) {
          App.state.hasVault = false;
          App.state.corrupted = false;
          return;
        }

        if (record?.envelope && CryptoManager.isValidEnvelope(record.envelope)) {
          App.state.hasVault = true;
          App.state.corrupted = false;
        } else {
          App.state.hasVault = false;
          App.state.corrupted = true;
        }
      }

      async function init() {
        const root = document.getElementById('app-root');

        if (!window.crypto?.subtle) {
          root.replaceChildren(renderFatal('Web Crypto API در دسترس نیست. این برنامه برای امنیت به مرورگر مدرن با پشتیبانی از crypto.subtle نیاز دارد.'));
          return;
        }

        Dialog.init();
        SettingsManager.init();

        try {
          await DB.init();
          if (DB.fallback) {
            toast('ذخیره‌سازی IndexedDB در دسترس نیست. داده‌ها فقط تا پایان این نشست در حافظه می‌مانند.', 'error', 6000);
          }
        } catch {
          DB.fallback = true;
          toast('ذخیره‌سازی محلی با خطا مواجه شد. داده‌ها فقط به‌صورت موقت در حافظه نگه‌داری می‌شوند.', 'error', 6000);
        }

        App.state.ui = { q: '', ...SettingsManager.getPath('search') };

        await refreshVaultExistence();

        App.state.initialized = true;
        root.setAttribute('aria-busy', 'false');

        setupAutoLock();

        window.addEventListener('hashchange', renderCurrent);

        try {
          const mql = window.matchMedia('(prefers-color-scheme: dark)');
          if (typeof mql.addEventListener === 'function') {
            mql.addEventListener('change', () => SettingsManager.apply());
          } else if (typeof mql.addListener === 'function') {
            mql.addListener(() => SettingsManager.apply());
          }
        } catch {
          // older browsers may not support media query listeners
        }

        window.addEventListener('focus', () => SettingsManager.apply());
        document.addEventListener('visibilitychange', () => SettingsManager.apply());

        window.__appHidden = () => {
          if (!App.state.locked && SettingsManager.getPath('lockWhenHidden')) lockNow(true);
        };

        if (window.electronAPI && window.electronAPI.onAppHidden) {
          try {
            window.electronAPI.onAppHidden(() => {
              if (!App.state.locked && SettingsManager.getPath('lockWhenHidden')) lockNow(true);
            });
          } catch {
            // bridge unavailable
          }
        }

        if (!location.hash) {
          location.hash = App.state.locked ? '#/lock' : '#/dashboard';
        }

        renderCurrent();
      }

      init();
    })();
  </script>
</body>
</html>
